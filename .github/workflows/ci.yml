name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-web:
    name: Admin web
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Prepare coverage summary
        run: |
          mkdir -p coverage
          cp apps/admin/coverage/coverage-summary.json coverage/coverage-summary.json

      - name: Run lint and type checks
        run: yarn lint

      - name: Build admin application
        run: yarn build

      - name: Initialize coverage badge branch
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            exit 0
          fi
          git switch --orphan gh-pages
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --allow-empty -m "chore: initialize coverage badge branch [skip ci]"
          git push origin gh-pages
          git switch --detach "$GITHUB_SHA"

      - name: Publish coverage badge
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: we-cli/coverage-badge-action@v1.0.1

      - name: Store coverage badge in default branch
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git fetch origin gh-pages
          git show origin/gh-pages:badges/coverage.svg > badges/coverage.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update coverage badge [skip ci]"
          git push

  student-mobile:
    name: Student mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/student

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze source code
        run: flutter analyze

      - name: Run tests
        run: flutter test
